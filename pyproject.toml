[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninjatradebuilder"
version = "3.0.0"
requires-python = ">=3.11"
description = "Operator-facing Marimo app for NinjaTradeBuilder v3"
readme = "README.md"
dependencies = [
    "google-genai>=1.0,<2",
    "pydantic>=2.8,<3",
    "marimo>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
